<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="Projekt.css">
</head>
<body>
  <section class="seite">
    <header>
      <div class="titelbox">Kontakt</div>
      <nav>
        <a href="Uebermich.html">Über mich</a>
        <a href="Faehigkeit.html">Fähigkeit</a>
        <a href="Portfolio.html">Portfolio</a>
        <a href="Kontakt.html">Kontakt</a>
      </nav>
    </header>
    <main class="kontaktbereich">
      <div class="textfeld">
        <p>Nehmen Sie gerne Kontakt mit mir auf. Ich freue mich auf Ihre Nachricht und werde mich so schnell wie möglich bei Ihnen melden.</p>
      </div>
      <div class="socials">
        <a href="https://www.tiktok.com" target="_blank" rel="noopener">
          <img src="Bilder/Tiktok Logo.svg" alt="TikTok" loading="lazy" width="32" height="32">
        </a>
        <a href="https://www.linkedin.com" target="_blank" rel="noopener">
          <img src="Bilder/Linkedin Logo.webp" alt="LinkedIn" loading="lazy" width="32" height="32">
        </a>
        <a href="https://www.x.com" target="_blank" rel="noopener">
          <img src="Bilder/X Logo.svg" alt="X" loading="lazy" width="32" height="32">
        </a>
        <a href="https://www.instagram.com" target="_blank" rel="noopener">
          <img src="Bilder/Insta Logo.svg" alt="Instagram" loading="lazy" width="32" height="32">
        </a>
      </div>
      <form>
        <h3>Kontaktformular</h3>
        <div class="formular-zeile">
          <input type="text" placeholder="Vorname">
          <input type="text" placeholder="Nachname">
        </div>
        <input type="email" placeholder="E-Mail">
        <textarea placeholder="Nachricht"></textarea>
        <button type="submit">Senden</button>
      </form>
    </main>
    <a class="button rechts" href="Uebermich.html">← Anfang</a>
  </section>
</body>
</html>
